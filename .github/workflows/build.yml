name: Compile obs-gstreamer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            git
            curl
            unzip

      - name: Prepare OBS Environment
        shell: msys2 {0}
        run: |
          # 1. Get OBS source code to extract the C-headers
          git clone --depth 1 https://github.com/obsproject/obs-studio.git
          
          # 2. Grab the actual binary zip (filtering out 'pdb' debug files)
          LATEST_URL=$(curl -s https://api.github.com/repos/obsproject/obs-studio/releases/latest | grep -i "browser_download_url.*\.zip" | grep -i "windows" | grep -iv "pdb" | grep -iv "debug" | head -n 1 | cut -d '"' -f 4)
          echo "Downloading OBS binary from: $LATEST_URL"
          curl -sL "$LATEST_URL" -o obs.zip
          unzip -q obs.zip -d obs-binary
          
          # 3. Create a fake installation directory for our compiler
          mkdir -p fake-prefix/include/obs
          cp -r obs-studio/libobs/* fake-prefix/include/obs/
          
          # Manually create obsconfig.h
          cat <<EOF > fake-prefix/include/obs/obsconfig.h
          #pragma once
          #define OBS_VERSION "32.2.1"
          EOF
          
          # Grab the actual obs.dll with a safety check
          mkdir -p fake-prefix/lib/pkgconfig
          OBS_DLL=$(find obs-binary -name "obs.dll" | head -n 1)
          if [ -z "$OBS_DLL" ]; then
            echo "ERROR: obs.dll not found in the downloaded zip!"
            exit 1
          fi
          echo "Successfully found obs.dll at: $OBS_DLL"
          
          # Give it both names to guarantee the MinGW linker finds it
          cp "$OBS_DLL" fake-prefix/lib/obs.dll
          cp "$OBS_DLL" fake-prefix/lib/libobs.dll
          
          # 4. Generate the pkg-config manifest
          cat <<EOF > fake-prefix/lib/pkgconfig/libobs.pc
          prefix=$(pwd)/fake-prefix
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          
          Name: libobs
          Description: OBS Studio Library
          Version: 32.2.1
          Libs: -L\${libdir} -lobs
          Cflags: -I\${includedir}
          EOF

      - name: Compile Plugin
        shell: msys2 {0}
        run: |
          # Tell Meson where our forged pkg-config manifest is
          export PKG_CONFIG_PATH="$(pwd)/fake-prefix/lib/pkgconfig"
          
          # Setup and build
          meson setup --buildtype release build || (cat build/meson-logs/meson-log.txt && exit 1)
          ninja -C build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-windows
          path: build/obs-gstreamer.dll
